<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1832"/>
      <stop offset="100%" stop-color="#0e0d17"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cda8ff"/>
      <stop offset="50%" stop-color="#f8a4d8"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a88aff"/>
      <stop offset="100%" stop-color="#7ee2bb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#a88aff" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="17" fill="none" stroke="rgba(197, 170, 255, 0.22)" stroke-width="1.5"/>
  <!-- Headphone Arc -->
  <path d="M16 32 C 16 19, 48 19, 48 32" fill="none" stroke="url(#headphoneGrad)" stroke-width="3" stroke-linecap="round"/>
  <rect x="13.5" y="30" width="5" height="11" rx="2.5" fill="#a88aff"/>
  <rect x="45.5" y="30" width="5" height="11" rx="2.5" fill="#7ee2bb"/>
  <!-- Musical Double Note with Glow -->
  <g filter="url(#glow)">
    <path d="M41 23 v17.5 a6 6 0 1 1-3.5-5.4 V27 l-13 3 v15 a6 6 0 1 1-3.5-5.4 V24.5 z" fill="url(#noteGrad)"/>
  </g>
</svg>
